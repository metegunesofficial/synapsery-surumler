name: Dağıtım denetimi

on:
  pull_request:
  push:
    branches: [main]
  release:
    types: [published, edited]
  schedule:
    - cron: '17 6 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dagitim-denetimi-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  dagitim:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          filter: blob:none
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
      - run: bun test
      - run: bun scripts/dagitim-denetimi.ts
